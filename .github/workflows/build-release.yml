name: Build & Release

# Builds native installers on GitHub's own runners (Android SDK / Visual
# Studio / Xcode already preinstalled there) so no local install is needed
# on the developer machine. Runs on every version tag push (v1.0.0, etc.)
# or manually via workflow_dispatch, and uploads all artifacts to one
# GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build Windows (silence deprecated experimental/coroutine error in permission_handler_windows)
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Zip Windows build
        run: powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LOCORA-Player-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: LOCORA-Player-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev libmpv-dev mpv
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar Linux build
        run: tar -czf LOCORA-Player-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: LOCORA-Player-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS build
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app LOCORA-Player-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: LOCORA-Player-macos.zip

  release:
    needs: [android, windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release with all builds
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/windows-zip/LOCORA-Player-windows.zip
            artifacts/linux-tar/LOCORA-Player-linux.tar.gz
            artifacts/macos-zip/LOCORA-Player-macos.zip
